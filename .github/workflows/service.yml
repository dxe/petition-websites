name: Deploy service

on:
  push:
    branches:
      - main
    paths:
      - apps/service/**
  workflow_dispatch:

jobs:
  deploy_service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Short commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image & push to ECR
        uses: kciter/aws-ecr-action@master
        with:
          path: ./apps/service
          dockerfile: ./apps/service/Dockerfile
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          repo: dxe/helptheducks-service
          region: us-west-2
          tags: latest,${{ steps.sha.outputs.short }}

  # Dispatches deploy-ecs.yml in dxe/terraform, which bumps this service's image
  # tag. No AWS creds here, and it does not wait — apply-deploy.yml alerts on failure.
  deploy:
    needs: deploy_service
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: dxe
          repositories: terraform

      - name: Trigger the deploy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run deploy-ecs.yml --repo dxe/terraform \
            -f service=helptheducks-service \
            -f tag="${GITHUB_SHA::7}" \
            -f caller_run_id=${{ github.run_id }}
